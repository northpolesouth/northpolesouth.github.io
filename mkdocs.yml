site_name: North Pole South
site_description: Documentation for the North Pole South light show
site_url: https://northpolesouth.github.io/
repo_url: https://github.com/northpolesouth/northpolesouth.github.io
copyright: >
  These guides describe what worked for my show. Use them at your own risk;
  I assume no responsibility for any problems. <a href="/disclaimer/">Full disclaimer</a>.

theme:
  name: material
  palette:
    primary: custom
    accent: custom
  icon:
    logo: material/pine-tree
  favicon: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

nav:
  - Home: index.md
  - Getting Started (Setup): getting-started.md
  - Live LOR Play List: live-lor-playlist.md
  - Sequence from Scratch: sequence-from-scratch.md
  - Singing Faces with Claude: singing-faces.md
  - Singing Elf Matrix Video: singing-elf-matrix-video.md
  - Disclaimer: disclaimer.md

extra_css:
  - stylesheets/christmas.css

extra_javascript:
  - javascripts/snow.js

markdown_extensions:
  - admonition

plugins:
  - search